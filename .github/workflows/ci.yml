name: CI

# Cuándo se ejecuta: en cada push (a cualquier rama), en cada Pull Request hacia main
# y manualmente desde la pestaña Actions (workflow_dispatch).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principio de mínimo privilegio: el pipeline solo necesita leer el código.
permissions:
  contents: read

jobs:
  build-y-pruebas:
    name: Build, pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17 (con caché de dependencias Maven)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify = compilar + pruebas unitarias + reporte JaCoCo + verificar umbral de cobertura.
      # Si una prueba falla o la cobertura baja del 80%, este paso falla y el pipeline queda en rojo.
      - name: Compilar, probar y verificar cobertura
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR > 1 { perdidas += $8; cubiertas += $9 }
                     END { total = perdidas + cubiertas;
                           if (total > 0) printf "### Cobertura de líneas: %.1f%% (%d de %d)\n", cubiertas * 100 / total, cubiertas, total }' \
              "$csv" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No se generó reporte de cobertura (¿falló la compilación o las pruebas?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # if: always() -> se suben los reportes incluso si las pruebas fallaron (para poder revisar la causa del fallo).
      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # Reto opcional 1: matriz de versiones. Va en un job aparte para NO cambiar el nombre del job
  # principal ("Build, pruebas y cobertura"), que es el check que exige el ruleset de main.
  matriz-java:
    name: Pruebas con Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java ${{ matrix.java }} (con caché de dependencias Maven)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar, probar y verificar cobertura
        run: mvn -B verify